# Server configuration, including work path, PID file, and email service settings for sending notifications or alerts.
server:
  work_path: /home/chen/workspace/LarkBot
  pid_file: bot.pid

# 飞书机器人配置：可配置多个，业务按 name 取对应的 webhook 发送。
# GitHub Webhook 通知固定使用 github_bot，未配置时使用 default_bot。
feishu:
  github_bot: "default"
  default_bot: "default"

  bots:
    - name: "default"
      webhook_url: ""                                    # 格式：https://open.feishu.cn/open-apis/bot/v2/hook/xxxx
      enable_signature: false
      secret: ""
      enabled: true

    # - name: "alert"                                    # 告警
    #   webhook_url: ""
    #   enable_signature: true
    #   secret: ""
    #   enabled: true

# 每日点餐提醒
meal_reminder:
  enabled: true
  hour: 18
  minute: 0
  skip_weekdays: [ 5, 6 ]        # 周一=1 ... 周日=7，周五、周六不发送
  test_on_startup: true        # 启动后立即发一次，方便测试；正式环境改为 false
  bot: ""                      # 为空时使用 feishu.github_bot

# blog 后端 RPC 服务地址，用于转发 GitHub webhook 数据
rpc_address:
  blog: "127.0.0.1:8092"

# GitHub App 配置，用于 AI review 认证
github:
  app_id: ""
  private_key_path: ""

# AI 代码审查配置（独立于 blog 的 ai 配置）
ai_review:
  enabled: false
  provider: "openai"                                           # AI 厂商: openai / claude
  api_key: ""
  api_url: "https://api.openai.com/v1"                         # 兼容 OpenAI API 的地址
  model: "gpt-4o"                                              # 模型名
  max_tokens: 4096                                             # 最大输出 token
  review_trigger: "opened,synchronize"                         # 触发 review 的 PR action 列表
  review_comment_mode: "update"                                # 评论模式: update（增量更新）/ append（每次新评论）
