# Chen Blog System Configuration
# This configuration file defines the settings for the Chen Blog system, including server configurations, worker threads, logging, database connections, and Redis settings.

# Servers Configuration, defining the HTTP and WebSocket servers with their respective settings.
servers:
  - address: ["0.0.0.0:8090"]
    keepalive: 1
    timeout: 1000
    name: chen-http/1.0.0
    accept_worker: accept
    io_worker: io
    process_worker: io
    type: http

# Worker threads configuration, defining the number of threads for IO and accept workers.
workers:
  io:
    thread_num: 1
  accept:
    thread_num: 1

# Server configuration, including work path, PID file, and email service settings for sending notifications or alerts.
server:
  work_path: /home/chen/workspace/LarkBot
  pid_file: bot.pid

# Logging configuration, defining different loggers for root, system, and access logs with their respective levels, formatters, and appenders.
logs:
  - name: root
    level: info
    formatter: "[%d{%Y-%m-%d %H:%M:%S.%f}]%T%t%T%N%T[%p]%T[%c]%T%f:%l%T%m%n"
    appenders:
      - type: FileLogAppender
        file: /home/chen/workspace/LarkBot/logs/root.log
      - type: StdoutLogAppender
  - name: system
    level: info
    formatter: "[%d{%Y-%m-%d %H:%M:%S.%f}]%T%t%T%N%T[%p]%T[%c]%T%f:%l%T%m%n"
    appenders:
      - type: FileLogAppender
        file: /home/chen/workspace/LarkBot/logs/system.log
      - type: StdoutLogAppender
  - name: access
    level: info
    formatter: "[%d{%Y-%m-%d %H:%M:%S.%f}]%T%t%T%N%T[%p]%T[%c]%T%f:%l%T%m%n"
    appenders:
      - type: FileLogAppender
        file: /home/chen/workspace/LarkBot/logs/access.log
      - type: StdoutLogAppender
  - name: bot
    level: info
    formatter: "[%d{%Y-%m-%d %H:%M:%S.%f}]%T%t%T%N%T[%p]%T[%c]%T%f:%l%T%m%n"
    appenders:
      - type: FileLogAppender
        file: /home/chen/workspace/LarkBot/logs/bot.log
      - type: StdoutLogAppender

# Redis configuration for Fox Thread, defining the Redis settings for the Fox Thread component, including the name, number of connections, and advance settings.
fox_thread:
  redis:
    name: redis
    num: 1
    advance: 0

# Redis configuration for the blog, defining the host, type, pool size, and timeout settings for the Redis connection used by the blog.
redis:
  config:
    blog:
      host: 127.0.0.1:6379
      type: fox_redis
      pool: 1
      timeout: 100
  desc: "type: redis,redis_cluster,fox_redis,fox_redis_cluster"

# 这里设置飞书机器人的webhook地址，格式如下：https://open.feishu.cn/open-apis/bot/v2/hook/xxxx-xxxx-xxxx-xxxx
feishu:
  webhook_url: ""
  enable_signature: 0
  secret: ""

# blog 后端 RPC 服务地址，用于转发 GitHub webhook 数据
blog:
  rpc_address: "127.0.0.1:8092"

# GitHub App 配置，用于 AI review 认证
github:
  app_id: ""
  private_key_path: ""

# AI 代码审查配置（独立于 blog 的 ai 配置）
ai_review:
  provider: "openai"                                           # AI 厂商: openai / claude
  api_key: ""
  api_url: "https://api.openai.com/v1"                         # 兼容 OpenAI API 的地址
  model: "gpt-4o"                                              # 模型名
  max_tokens: 4096                                             # 最大输出 token
  review_trigger: "opened,synchronize"                         # 触发 review 的 PR action 列表
  review_comment_mode: "update"                                # 评论模式: update（增量更新）/ append（每次新评论）
